[package]
name = "dices-badge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dices_badge"
# `rlib` so Rust tests can link it, `staticlib` so the Tactility app (C/C++) can
crate-type = ["staticlib", "rlib"]

[features]
# Host-only manual prerenderer (see src/bin/prerender.rs): gated so a
# `cargo build -p dices-badge` for the target never tries to build it.
prerender = []

[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["prerender"]

[dependencies]
dices-engine.workspace = true
dices-man.workspace = true
dices-parser.workspace = true
dices-print.workspace = true
dices-print-cli.workspace = true
dices-std.workspace = true
dices-values.workspace = true

pretty.workspace = true
rand.workspace = true

[lints]
workspace = true
