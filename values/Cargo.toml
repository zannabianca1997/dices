[package]
name = "dices-values"
version.workspace = true
edition.workspace = true
license.workspace = true

[[test]]
name = "macros"
required-features = ["macros"]

[dependencies]
dices-print.workspace = true
dices-values-macros = { workspace = true, optional = true }

derive_more = { workspace = true, features = ["full"] }
num = { workspace = true, features = ["num-bigint", "rand", "serde"] }
paste = "1.0.15"
pretty.workspace = true
rand.workspace = true
serde.workspace = true
snafu.workspace = true
strum = { workspace = true, features = ["derive"] }
yoke = "0.8.3"

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[features]
macros = ["dep:dices-values-macros"]

[lints]
workspace = true
