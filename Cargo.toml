[workspace]
resolver = "3"
members = ["ast", "values"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
dices-ast = { path = "ast" }
dices-values = { path = "values" }

derive_more = { version = "2.1.1", features = ["full"] }
serde = "1.0.228"
snafu = "0.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
