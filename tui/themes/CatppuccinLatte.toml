# Catppuccin Latte
# https://github.com/catppuccin/palette

reset = true
bold = false
intense = false
underline = false
dimmed = false
italic = false
strikethrough = false

# Graphical fluff (emojis): subdued.
[fluff]
fg_color = "#8c8fa1"  # overlay1

[value.null]
fg_color = "#8c8fa1"  # overlay1
italic = true

[value.integer]
fg_color = "#fe640b"  # peach

[value.bool]
fg_color = "#8839ef"  # mauve

[value.string]
fg_color = "#40a02b"  # green

[value.string.escape]
fg_color = "#fe640b"  # peach

[value.delimiter]
depth = [
  { fg_color = "#df8e1d" },  # yellow
  { fg_color = "#1e66f5" },  # blue
  { fg_color = "#8839ef" },  # mauve
  { fg_color = "#179299" },  # teal
  { fg_color = "#04a5e5" },  # sky
  { fg_color = "#7287fd" },  # lavender
]

[value.punctuator]
fg_color = "#6c6f85"  # subtext0

[value.injected]
fg_color = "#df8e1d"  # yellow

# Ast styling for rendered syntax trees.
[ast]
[ast.ident]
fg_color = "#04a5e5"  # sky

# Markdown styling for banners and manual.
[markdown]
[markdown.header]
depth = [
  { bold = true, fg_color = "#df8e1d" },
  { bold = true, fg_color = "#1e66f5" },
  { fg_color = "#8839ef" },
  { fg_color = "#179299" },
  { fg_color = "#04a5e5" },
  { fg_color = "#7287fd" },
]

[markdown.inline_code]
fg_color = "#ea76cb"  # pink

[markdown.bold_text]
bold = true
fg_color = "#dc8a78"  # rosewater

[markdown.italic_text]
italic = true

[markdown.list.marker]
bold = true
fg_color = "#40a02b"  # green

[prompt]
fg_color = "#1e66f5"  # blue

[prompt.indicator]
fg_color = "#40a02b"  # green

[prompt.multiline]
fg_color = "#8c8fa1"  # overlay1

[prompt.right]
fg_color = "#8c8fa1"  # overlay1

[error]
fg_color = "#d20f39"  # red

[error.message]
bold = true

[error.source]
