[package]
name = "dices-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dices"
path = "src/main.rs"

[dependencies]
dices-engine.workspace = true
dices-parser.workspace = true

chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env", "string", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["serde"] }
derive_more.workspace = true
directories = "6.0.0"
error_reporter = "1.0.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
nu-ansi-term = { version = "0.50.3", features = ["derive_serde_style", "serde"] }
pretty = { workspace = true, features = ["termcolor"] }
rand_seeder = "0.5.0"
reedline = "0.48.0"
serde.workspace = true
snafu.workspace = true
strum.workspace = true
toml = "1.1.2"

[lints]
workspace = true
